<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Agent Browser Fixture</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 24px;
        line-height: 1.4;
      }
      .row {
        margin-bottom: 12px;
      }
      .item {
        padding: 4px 0;
      }
      #drag-src {
        width: 120px;
        padding: 8px;
        background: #e0f0ff;
        border: 1px solid #88a;
        cursor: grab;
      }
      #drag-dst {
        width: 200px;
        height: 50px;
        border: 2px dashed #888;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #spacer {
        height: 1200px;
      }
      #mid-spacer {
        height: 160px;
      }
      #bottom-target {
        padding: 8px;
        background: #ffe9c6;
      }
      #editable-frame {
        width: 360px;
        height: 120px;
        border: 1px solid #888;
      }
      #caret-input {
        width: 280px;
        padding: 12px 16px;
        border: 2px solid #111;
        background: #fff;
        color: #111;
        caret-color: rgb(255, 0, 0);
        font: 28px/1.2 Menlo, Monaco, monospace;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Agent Browser Fixture</h1>

    <div class="row">
      <button id="btn-alert">Alert</button>
      <button id="btn-confirm">Confirm</button>
      <button id="btn-prompt">Prompt</button>
    </div>
    <div class="row">
      <div id="prompt-result">Prompt result: none</div>
      <div id="confirm-result">Confirm result: none</div>
    </div>

    <div class="row">
      <label for="email-input">Email</label>
      <input id="email-input" type="text" placeholder="Email" aria-label="Email">
    </div>

    <div class="row">
      <textarea id="notes" aria-label="Notes"></textarea>
    </div>

    <div class="row">
      <button id="select-email">Select Email</button>
      <button id="focus-notes">Focus Notes</button>
    </div>

    <div class="row">
      <button id="page-copy">Page Copy</button>
      <button id="page-paste">Page Paste</button>
      <div id="clipboard-api-status" role="status" aria-label="Clipboard API status">
        Clipboard API: idle
      </div>
    </div>

    <div class="row">
      <div id="native-clipboard-status" role="status" aria-label="Native clipboard status">
        Native clipboard: idle
      </div>
    </div>

    <div class="row">
      <div id="editable" contenteditable="true">Editable</div>
    </div>

    <div class="row">
      <input id="check-me" type="checkbox">
      <label for="check-me">Check me</label>
    </div>

    <div class="row">
      <select id="select-me" aria-label="Select">
        <option value="">Choose</option>
        <option value="a">Option A</option>
        <option value="b">Option B</option>
      </select>
    </div>

    <div class="row">
      <div id="drag-src" draggable="true">Drag me</div>
      <div id="drag-dst">Drop here</div>
    </div>

    <div class="row">
      <input id="file-input" type="file" multiple>
      <div id="file-output">No files</div>
    </div>

    <div class="row">
      <button id="fetch-btn">Fetch data</button>
      <div id="fetch-output">Fetch output: none</div>
    </div>

    <div class="row">
      <a id="download-link" href="#" download="agent-download.txt">Download file</a>
      <div id="download-output">Download ready</div>
    </div>

    <div class="row">
      <button id="console-btn" data-testid="console-button">Console log</button>
      <button id="error-btn">Throw error</button>
      <img id="logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Logo">
      <div id="title-tip" title="Close">Tooltip target</div>
    </div>

    <div class="row">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
    </div>

    <div class="row">
      <button id="frame-launch">Frame Ready</button>
      <iframe id="inner-frame" srcdoc="<html><body><button id='frame-btn'>Frame Button</button><div id='frame-text'>Frame text</div></body></html>"></iframe>
    </div>

    <div class="row">
      <label for="editable-frame">Iframe Editor</label>
      <iframe id="editable-frame" srcdoc="<html><body style='margin:0;padding:8px;font-family:Arial,sans-serif'><div id='iframe-editor' contenteditable='true' style='min-height:48px;padding:8px;border:1px solid #888'>Iframe editable</div></body></html>"></iframe>
    </div>

    <div class="row">
      <label for="caret-input">Caret Probe</label>
      <input id="caret-input" type="text" aria-label="Caret Probe">
    </div>

    <div id="mid-spacer"></div>

    <div class="row">
      <label for="lower-input">Lower Input</label>
      <input id="lower-input" type="text" placeholder="Lower Input" aria-label="Lower Input">
    </div>

    <div id="spacer"></div>
    <div id="bottom-target">Bottom target</div>

    <script>
      const alertBtn = document.getElementById('btn-alert');
      const confirmBtn = document.getElementById('btn-confirm');
      const promptBtn = document.getElementById('btn-prompt');
      const promptResult = document.getElementById('prompt-result');
      const confirmResult = document.getElementById('confirm-result');
      const emailInput = document.getElementById('email-input');
      const notes = document.getElementById('notes');
      const selectEmailBtn = document.getElementById('select-email');
      const focusNotesBtn = document.getElementById('focus-notes');
      const pageCopyBtn = document.getElementById('page-copy');
      const pagePasteBtn = document.getElementById('page-paste');
      const clipboardApiStatus = document.getElementById('clipboard-api-status');
      const nativeClipboardStatus = document.getElementById('native-clipboard-status');
      const dragSrc = document.getElementById('drag-src');
      const dragDst = document.getElementById('drag-dst');
      const fileInput = document.getElementById('file-input');
      const fileOutput = document.getElementById('file-output');
      const fetchBtn = document.getElementById('fetch-btn');
      const fetchOutput = document.getElementById('fetch-output');
      const downloadLink = document.getElementById('download-link');
      const downloadOutput = document.getElementById('download-output');
      const consoleBtn = document.getElementById('console-btn');
      const errorBtn = document.getElementById('error-btn');
      const downloadBlob = new Blob(['agent download fixture'], { type: 'text/plain' });

      downloadLink.href = URL.createObjectURL(downloadBlob);
      downloadLink.addEventListener('click', () => {
        downloadOutput.textContent = 'Download started';
      });

      alertBtn.addEventListener('click', () => {
        alert('Hello from alert');
      });

      confirmBtn.addEventListener('click', () => {
        const ok = confirm('Confirm me');
        confirmResult.textContent = ok ? 'Confirm result: accepted' : 'Confirm result: dismissed';
      });

      promptBtn.addEventListener('click', () => {
        const value = prompt('Prompt me', 'default');
        promptResult.textContent = value == null ? 'Prompt result: cancelled' : `Prompt result: ${value}`;
      });

      selectEmailBtn.addEventListener('click', () => {
        emailInput.focus();
        emailInput.setSelectionRange(0, emailInput.value.length);
      });

      focusNotesBtn.addEventListener('click', () => {
        notes.focus();
        const cursor = notes.value.length;
        notes.setSelectionRange(cursor, cursor);
      });

      const activeSelectionText = () => {
        const active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
          const value = active.value;
          const start = active.selectionStart;
          const end = active.selectionEnd;
          if (typeof value === 'string' && typeof start === 'number' && typeof end === 'number') {
            return value.substring(start, end);
          }
        }
        const selection = window.getSelection();
        return selection ? selection.toString() : '';
      };

      document.addEventListener('copy', () => {
        nativeClipboardStatus.textContent = `Native clipboard: copy:${activeSelectionText()}`;
      });

      document.addEventListener('cut', () => {
        nativeClipboardStatus.textContent = `Native clipboard: cut:${activeSelectionText()}`;
      });

      document.addEventListener('paste', (event) => {
        const text = event.clipboardData?.getData('text/plain') || '';
        nativeClipboardStatus.textContent = `Native clipboard: paste:${text}`;
      });

      pageCopyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(emailInput.value);
          clipboardApiStatus.textContent = `Clipboard API write: ${emailInput.value}`;
        } catch (err) {
          clipboardApiStatus.textContent = `Clipboard API write: ${err?.name || String(err)}`;
        }
      });

      pagePasteBtn.addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          notes.focus();
          const start = typeof notes.selectionStart === 'number' ? notes.selectionStart : notes.value.length;
          const end = typeof notes.selectionEnd === 'number' ? notes.selectionEnd : start;
          const value = notes.value;
          notes.value = value.slice(0, start) + text + value.slice(end);
          const cursor = start + text.length;
          notes.setSelectionRange(cursor, cursor);
          notes.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertFromPaste', data: text }));
          clipboardApiStatus.textContent = `Clipboard API read: ${text}`;
        } catch (err) {
          clipboardApiStatus.textContent = `Clipboard API read: ${err?.name || String(err)}`;
        }
      });

      dragSrc.addEventListener('dragstart', (event) => {
        event.dataTransfer.setData('text/plain', 'drag-data');
      });

      dragDst.addEventListener('dragover', (event) => {
        event.preventDefault();
      });

      dragDst.addEventListener('drop', (event) => {
        event.preventDefault();
        const data = event.dataTransfer.getData('text/plain');
        dragDst.textContent = data || 'dropped';
      });

      fileInput.addEventListener('change', () => {
        const names = Array.from(fileInput.files || []).map((f) => f.name).join(', ');
        fileOutput.textContent = names ? `Files: ${names}` : 'No files';
      });

      fetchBtn.addEventListener('click', async () => {
        fetchOutput.textContent = 'Fetch output: loading';
        try {
          const response = await fetch('https://example.com/route-test');
          const text = await response.text();
          fetchOutput.textContent = `Fetch output: ${text.slice(0, 40)}`;
        } catch (err) {
          fetchOutput.textContent = `Fetch output: error`;
        }
      });

      consoleBtn.addEventListener('click', () => {
        console.log('console: hello', { ok: true });
      });

      errorBtn.addEventListener('click', () => {
        setTimeout(() => {
          throw new Error('fixture error');
        }, 0);
      });
    </script>
  </body>
</html>
