name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Download CEF runtime
        if: runner.os == 'macOS'
        run: |
          CEF_PATH="$(scripts/download-cef-runtime.sh native-macos "$RUNNER_TEMP/cef")"
          echo "CEF_PATH=$CEF_PATH" >> "$GITHUB_ENV"
      - name: Stable
        run: cargo test
      - name: Stable (no default features)
        run: cargo test -p tabor_terminal --no-default-features
      - name: Oldstable
        run: |
          rustup default $(cat Cargo.toml | grep "rust-version" | sed 's/.*"\(.*\)".*/\1/')
          cargo test
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets --features signed-web-e2e
  check-macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install target
        run: rustup update && rustup target add x86_64-apple-darwin
      - name: Download CEF runtime
        run: |
          CEF_PATH="$(scripts/download-cef-runtime.sh macosx64 "$RUNNER_TEMP/cef")"
          echo "CEF_PATH=$CEF_PATH" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --target=x86_64-apple-darwin
