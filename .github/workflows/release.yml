name: Release

on:
  create:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "create" ]; then
            RELEASE_TAG="$GITHUB_REF"
          else
            RELEASE_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "Release workflow requires the checked-out commit to match an exact tag."
            exit 1
          fi

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v, got: $RELEASE_TAG"
              exit 1
              ;;
          esac

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: brew install scdoc
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Missing APPLE_CERTIFICATE_P12_BASE64 or APPLE_CERTIFICATE_PASSWORD secret."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/tabor-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/tabor-cert.p12"
          security import "$RUNNER_TEMP/tabor-cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm "$RUNNER_TEMP/tabor-cert.p12"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Resolve signing identity
        run: |
          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep "Developer ID Application" \
              | head -1 \
              | sed -nE 's/.*"([^"]+)".*/\1/p'
          )"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application certificate found."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare toolchain
        run: rustup update
      - name: Download CEF runtime
        run: |
          CEF_URL="https://cef-builds.spotifycdn.com/cef_binary_144.0.11+ge135be2+chromium-144.0.7559.97_macosarm64.tar.bz2"
          CEF_ARCHIVE="$RUNNER_TEMP/cef_binary_macosarm64.tar.bz2"
          CEF_EXTRACT_DIR="$RUNNER_TEMP/cef"

          curl --fail --location "$CEF_URL" --output "$CEF_ARCHIVE"
          mkdir -p "$CEF_EXTRACT_DIR"
          tar -xjf "$CEF_ARCHIVE" -C "$CEF_EXTRACT_DIR"

          CEF_ROOT="$(find "$CEF_EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$CEF_ROOT" ]; then
            echo "Failed to locate extracted CEF directory."
            exit 1
          fi

          echo "TABOR_CEF_PATH=$CEF_ROOT" >> "$GITHUB_ENV"
          echo "CEF_PATH=$CEF_ROOT" >> "$GITHUB_ENV"
      - name: Make DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          TABOR_CODESIGN_IDENTITY="$SIGNING_IDENTITY" \
          TABOR_CODESIGN_TEAM_ID="${APPLE_TEAM_ID:-7A5AR5N85X}" \
          TABOR_CODESIGN_HARDENED_RUNTIME=1 \
          TABOR_CODESIGN_TIMESTAMP=1 \
          make dmg
      - name: Notarize Application
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER }}
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing notarization secret: APPLE_TEAM_ID."
            exit 1
          fi

          if [ -n "$APPLE_NOTARY_API_KEY_P8_BASE64" ] && [ -n "$APPLE_NOTARY_API_KEY_ID" ] && [ -n "$APPLE_NOTARY_API_ISSUER" ]; then
            NOTARY_KEY_PATH="$RUNNER_TEMP/tabor-notary-api-key.p8"
            printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"

            TABOR_NOTARY_API_KEY_PATH="$NOTARY_KEY_PATH" \
            TABOR_NOTARY_API_KEY_ID="$APPLE_NOTARY_API_KEY_ID" \
            TABOR_NOTARY_API_ISSUER="$APPLE_NOTARY_API_ISSUER" \
            scripts/notarize-macos-app.sh ./target/release/osx/Tabor.app ./target/release/osx/Tabor.dmg
            rm -f "$NOTARY_KEY_PATH"
          elif [ -n "$APPLE_ID_USERNAME" ] && [ -n "$APPLE_ID_PASSWORD" ]; then
            TABOR_NOTARY_APPLE_ID="$APPLE_ID_USERNAME" \
            TABOR_NOTARY_APP_SPECIFIC_PASSWORD="$APPLE_ID_PASSWORD" \
            TABOR_NOTARY_TEAM_ID="$APPLE_TEAM_ID" \
            scripts/notarize-macos-app.sh ./target/release/osx/Tabor.app ./target/release/osx/Tabor.dmg
          else
            echo "Missing notarization credentials. Provide API key secrets (APPLE_NOTARY_API_KEY_P8_BASE64, APPLE_NOTARY_API_KEY_ID, APPLE_NOTARY_API_ISSUER) or Apple ID secrets (APPLE_ID_USERNAME, APPLE_ID_PASSWORD), plus APPLE_TEAM_ID."
            exit 1
          fi
      - name: Upload Application
        run: |
          mv ./target/release/osx/Tabor.dmg ./Tabor-${RELEASE_TAG}.dmg
          cp ./Tabor-${RELEASE_TAG}.dmg ./Tabor.dmg
          ./.github/workflows/upload_asset.sh ./Tabor-${RELEASE_TAG}.dmg $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./Tabor.dmg $GITHUB_TOKEN
      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  windows:
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "create" ]; then
            RELEASE_TAG="$GITHUB_REF"
          else
            RELEASE_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "Release workflow requires the checked-out commit to match an exact tag."
            exit 1
          fi

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v, got: $RELEASE_TAG"
              exit 1
              ;;
          esac

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Upload portable executable
        run: |
          cp ./target/release/tabor.exe ./Tabor-${RELEASE_TAG}-portable.exe
          ./.github/workflows/upload_asset.sh \
            ./Tabor-${RELEASE_TAG}-portable.exe $GITHUB_TOKEN
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.5
      - name: Create msi installer
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5 WixToolset.Util.wixext/4.0.5
          wix build -arch "x64" -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
          -out "./Tabor-${RELEASE_TAG}-installer.msi" "tabor/windows/wix/tabor.wxs"
      - name: Upload msi installer
        run: |
          ./.github/workflows/upload_asset.sh \
            ./Tabor-${RELEASE_TAG}-installer.msi $GITHUB_TOKEN

  linux:
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "create" ]; then
            RELEASE_TAG="$GITHUB_REF"
          else
            RELEASE_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "Release workflow requires the checked-out commit to match an exact tag."
            exit 1
          fi

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v, got: $RELEASE_TAG"
              exit 1
              ;;
          esac

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get install cmake pkg-config libfreetype6-dev libfontconfig1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev python3 scdoc
      - name: Test
        run: cargo test --release
      - name: Generate manpages
        run: |
          scdoc < extra/man/tabor.1.scd | gzip -c > "./tabor.1.gz"
          scdoc < extra/man/tabor-msg.1.scd | gzip -c > "./tabor-msg.1.gz"
          scdoc < extra/man/tabor.5.scd | gzip -c > "./tabor.5.gz"
          scdoc < extra/man/tabor-bindings.5.scd | gzip -c > "./tabor-bindings.5.gz"
      - name: Upload Assets
        run: |
          mv ./extra/logo/tabor-term.svg ./Tabor.svg
          ./.github/workflows/upload_asset.sh ./Tabor.svg $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./tabor.1.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./tabor-msg.1.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./tabor.5.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./tabor-bindings.5.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./extra/completions/tabor.bash $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./extra/completions/tabor.fish $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./extra/completions/_tabor $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./extra/linux/Tabor.desktop $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./extra/tabor.info $GITHUB_TOKEN
